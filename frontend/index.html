<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#111114" />

    <title>VIPP Digital Services — Tournois d'échecs</title>
    <meta
      name="description"
      content="Plateforme de tournois d'échecs : inscription en ligne, appariements au système suisse, phase finale à élimination directe et classements en temps réel."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="VIPP Digital Services — Tournois d'échecs" />
    <meta
      property="og:description"
      content="Inscrivez-vous aux tournois, suivez vos parties et vibrez au rythme des plus grandes compétitions."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Préchargement des polices : évite le FOUT (flash de texte non stylisé)
         sans bloquer le rendu initial. display=swap garantit que le texte
         est visible immédiatement avec la police système en attendant. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&family=Barlow+Condensed:wght@500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&family=Barlow+Condensed:wght@500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
