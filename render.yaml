services:
  - type: web
    name: highfive-tournament-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Les variables suivantes sont à saisir manuellement dans le dashboard Render
      # Dashboard > highfive-tournament-api > Environment > Environment Variables
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_COOKIE_NAME
        sync: false
      - key: AUTH_COOKIE_SAMESITE
        sync: false
      - key: AUTH_COOKIE_SECURE
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VITE_APP_URL
        sync: false
